schema_version = "1.4"
reward_type = "bounded_continuous"
mode = "repair"
artifacts = ["/output/fe22839e-5022-5dd9-9220-65b16c728a04_D1_reproducer.patch", "/output/fe22839e-5022-5dd9-9220-65b16c728a04_D2_repair.patch", "/logs/agent/trajectory.json"]

[task]
uuid_v5 = "fe22839e-5022-5dd9-9220-65b16c728a04"
name = "ethara/fe22839e-5022-5dd9-9220-65b16c728a04"
version = "1.0.0"
description = "Find a security defect in fast-uri, prove it with a regression test, and repair it."
authors = [{ name = "Krishna Kaushal", email = "krishna.kaushal@ethara.ai" }]
keywords = ["security", "typescript-javascript", "vulnerability-repair", "regression-test"]

[metadata]
null_floor = 0.0
discrimination_weight = 0.5
category = "Code Security"
language = "typescript-javascript"
repo = "https://github.com/fastify/fast-uri"
base_commit = "a34ced25d015d12dfc2b0cf85ce01a4a0d12ecf6"
license = "BSD-3-Clause"
platforms = ["linux/amd64", "linux/arm64"]
harbor_release = "0.24.0"
reward_carrier = "/logs/verifier/reward.json"
reward_keys = ["pytest", "rubric", "reward"]
graded_key = "reward"
full_reward = 1.0
judge = "openai/gpt-6.1-sol through the codex CLI 0.169.0"
judge_dependency = "The rubric half needs the codex bridge at CODEX_BRIDGE_URL (default http://172.17.0.1:8788) and its key in KAKASHI_CODEX_BRIDGE_SECRET. Without either, or without an agent trajectory, tests/test.sh records the rubric as UNSCORED in /logs/verifier/rubric_judge_failed.txt and reward = pytest. The judge runs as an unprivileged uid and sets only the rubric value; the pytest value is scored as root before it runs."
agent_network = "The agent container has no network. Claude Code is baked into the image, so the agent phase fetches no package; the harness admits only the model endpoint with harbor --allow-agent-host. Through a bridge, admit the bridge IP (172.17.0.1 for the host bridge on :8790). Directly, admit api.anthropic.com; the agent then needs DNS through Harbor's egress sidecar."
agent_harness = "claude-code 2.1.326, baked at /usr/local/bin/claude and sha256-checked per architecture; run with --ak version=2.1.326 so Harbor uses it instead of installing one."
agent_model = "anthropic/claude-opus-4-8"
agent_run = "Through the host bridge: harbor run -p <task-dir> -a claude-code -m claude-opus-4-8 --ak version=2.1.326 --ak disable_web_search=true --ae ANTHROPIC_BASE_URL=http://172.17.0.1:8790 --ae ANTHROPIC_API_KEY=<bridge secret> --allow-agent-host 172.17.0.1. Pass the model without the anthropic/ prefix there: Harbor 0.24 forwards the prefix unchanged whenever ANTHROPIC_BASE_URL is set. Directly: -m anthropic/claude-opus-4-8 with CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY and --allow-agent-host api.anthropic.com."

[[metadata.deliverables]]
id = "D1"
path = "/output/fe22839e-5022-5dd9-9220-65b16c728a04_D1_reproducer.patch"
schema = "unified diff relative to the repository root that adds or changes test files only"
comparator = "its tests fail on the pristine tree with an assertion failure and all pass on the reference repair"
depends_on = []

[[metadata.deliverables]]
id = "D2"
path = "/output/fe22839e-5022-5dd9-9220-65b16c728a04_D2_repair.patch"
schema = "unified diff relative to the repository root; only sections on the vulnerable source files are applied"
comparator = "closes D1 and the withheld regression tests, keeps the pass-to-pass set, touches no protected path"
depends_on = ["D1"]

[agent]
network_mode = "no-network"
user = "1000"
timeout_sec = 5400

[environment]
environment_mode = "separate"
network_mode = "no-network"
build_timeout_sec = 3600
cpus = 2
memory_mb = 6144
storage_mb = 20480
gpus = 0

[verifier]
entrypoint = "tests/test.sh"
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["172.17.0.1", "host.docker.internal"]
timeout_sec = 18000
reward_file = "/logs/verifier/reward.json"

[verifier.env]
JUDGE_TRANSPORT = "${JUDGE_TRANSPORT:-codex}"
JUDGE_MODEL = "${JUDGE_MODEL:-openai/gpt-6.1-sol}"
CODEX_BRIDGE_URL = "${CODEX_BRIDGE_URL:-http://172.17.0.1:8788}"
KAKASHI_CODEX_BRIDGE_SECRET = "${KAKASHI_CODEX_BRIDGE_SECRET:-}"
LITELLM_LOCAL_MODEL_COST_MAP = "True"

[verifier.weights]
pytest = 0.5
rubric = 0.5

[verifier.robustness]
reruns = 1
jitter = false

[upstream_provenance]
repo = "https://github.com/fastify/fast-uri"
vulnerable_commit = "a34ced25d015d12dfc2b0cf85ce01a4a0d12ecf6"
advisory = "GHSA-jvvf-x445-j334, GHSA-wjr9-j795-jxcr"
contamination_note = "The held-out tests and the main reference fix derive from upstream commit f40a88f33e684a46faec3f5b820bcbb1e85add64 (BSD-3-Clause, GHSA-jvvf-x445-j334 / CVE-2026-86818), public since 2026-09-14; the second-weakness fix ports upstream commit f6d46dfeab025d0c440485f4ae29fa4f14707646 (GHSA-wjr9-j795-jxcr / CVE-2026-110180), public since 2026-10-10. Both may be in the training data of current models; the held-out serialization assertion is loosened from upstream to accept any header order."

[rubric]
judge_file = "tests/judge.toml"
criteria_count = 19
positive_weight = 42.0

[leak_gate]
private_carriers = [
    "solution/TRUTH.md",
    "solution/fix.patch",
    "solution/poc.bin",
    "solution/crash.log",
    "solution/solve.sh",
    "tests/data/poc.bin",
    "tests/validate.py",
]
agent_visible_roots = ["environment", "instruction.md"]
ngram_width = 8
containment_threshold = 0.3

[upstream_provenance.source]
fixed_commit = "f40a88f33e684a46faec3f5b820bcbb1e85add64"
secondary_fixed_commit = "f6d46dfeab025d0c440485f4ae29fa4f14707646"
