# Judged rubric criteria for bundle 9817daf5-6a35-512f-a0fc-d1fb71fdb182.
# Harbor Reward Kit judge-TOML: one [[criterion]] table per criterion.
# weight = source_weight / 38, the total positive source weight, so the RewardKit
# weighted-sum is the rubric channel: (satisfied positive source weights - satisfied
# penalty source weights) / 38. test.sh floors a negative value at 0.
# Every criterion is state_change, judged from the delivered fix.patch.

[judge]
judge = "openai/gpt-6.1-sol"
prompt_template = "prompt.md"
mode = "individual"
timeout = 300
weight = 1.0

[scoring]
aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "diff_getaligned_release_width_check"
description = "The agent submits a patch that makes the `GetAligned` method of `BitReader` reject a byte count larger than its destination type through a check that stays active in release builds."
type = "binary"
weight = 0.13157894736842105

[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "state_change"
importance = "critically_important"
source_weight = 5
total_positive_weight = 38.0
is_positive = true

