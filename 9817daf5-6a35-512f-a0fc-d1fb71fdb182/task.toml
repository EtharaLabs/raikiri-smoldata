schema_version = "1.4"
reward_type = "bounded_continuous"
mode = "e2e"
artifacts = ["/output/poc.bin", "/output/fix.patch", "/logs/agent/trajectory.json"]

[task]
uuid_v5 = "9817daf5-6a35-512f-a0fc-d1fb71fdb182"
authors = [{ name = "Krishna Kaushal", email = "krishna.kaushal@ethara.ai" }]
name = "ethara/9817daf5-6a35-512f-a0fc-d1fb71fdb182"
description = "Diagnose and patch out-of-bounds read defects in an analytics library's RLE and Parquet dictionary decoders [e2e]."
version = "1.0.0"
keywords = ["security", "cpp", "e2e"]

[agent]
network_mode = "no-network"
timeout_sec = 5400
workspace = "/root/workspace"
user = "1000"

[environment]
dockerfile = "environment/Dockerfile"
network_mode = "no-network"
build_timeout_sec = 7200.0
config = "environment/config/config.toml"
cpus = 2
memory_mb = 6144
storage_mb = 20480
gpus = 0
environment_mode = "separate"

[verifier]
network_mode = "allowlist"
allowed_hosts = ["172.17.0.1", "host.docker.internal"]
timeout_sec = 7200
entrypoint = "tests/test.sh"
reward_file = "/logs/verifier/reward.json"
environment_mode = "separate"

[verifier.env]
JUDGE_TRANSPORT = "${JUDGE_TRANSPORT:-codex}"
JUDGE_MODEL = "${JUDGE_MODEL:-openai/gpt-6.1-sol}"
CODEX_BRIDGE_URL = "${CODEX_BRIDGE_URL:-http://172.17.0.1:8788}"
KAKASHI_CODEX_BRIDGE_SECRET = "${KAKASHI_CODEX_BRIDGE_SECRET:-}"
LITELLM_LOCAL_MODEL_COST_MAP = "True"

[verifier.weights]
file = "tests/test_weights.json"
normalize = "component_weighted_mean"
clamp = [-1.0, 1.0]

[rubric]
file = "tests/judge.toml"
channel_relation = "disjoint"
compiled_linkage = "rubric item field deterministic_counterpart"
judge_file = "tests/judge.toml"
judge_format = "harbor-reward-kit"
criteria_count = 17
positive_weight = 38

[metadata]
agent_harness = "claude-code 2.1.326; SHA-256-verified native binary at /usr/local/bin/claude"
agent_model = "anthropic/claude-opus-4-8"
agent_run = "harbor run -p <task-dir> -a claude-code -m claude-opus-4-8 --ak version=2.1.326 --ak disable_web_search=true --ae ANTHROPIC_BASE_URL=http://172.17.0.1:8790 --ae ANTHROPIC_API_KEY=<bridge-secret> --allow-agent-host 172.17.0.1"
mode = "e2e"
language = "cpp"
task_id = "9817daf5-6a35-512f-a0fc-d1fb71fdb182"
category = "Security"
subcategory = "Vulnerability repair"
family = "real-binary-reproducer"
tags = ["e2e", "cpp", "arrow"]
repo = "https://github.com/apache/arrow.git"
kind = "crash-input"
platforms = ["linux/amd64", "linux/arm64"]
null_floor = 0.0
discrimination_weight = 0.5
# For Smoldata delivery the deterministic pytest ledger is the canonical reward. The
# LLM-judged rubric half needs the private codex bridge ([verifier.env] CODEX_BRIDGE_URL
# / KAKASHI_CODEX_BRIDGE_SECRET) and is vendor-internal only; without the bridge or its
# /healthz reachable, tests/test.sh records the rubric as
# UNSCORED and reward.json "reward" equals the pytest score.
canonical_reward = "pytest"

[leak_gate]
private_carriers = ["solution/TRUTH.md", "solution/fix.patch", "solution/poc.bin", "solution/crash.log", "tests/data/poc.bin"]
agent_visible_roots = ["environment", "instruction.md"]
ngram_width = 8
normalization = "casefold; collapse all runs of non-alphanumeric to a single space; strip leading and trailing space"
containment_threshold = 0.30

[rubric.item_schema]
required_fields = ["number", "criterion", "is_positive", "type", "evaluation_target", "importance", "score", "compiled", "evidence"]
optional_fields = ["deterministic_counterpart"]
conditional_required = [["compiled", "deterministic_counterpart"]]
number_pattern = "^R[0-9]+$"
score_values = [-5, -3, 1, 3, 5]
evidence_must_resolve_to_committed_file = true

[rubric.target_vocabulary]
evaluation_target = ["final_answer", "state_change", "trajectory", "user_facing_message"]
type = ["agent behavior", "factuality & hallucination", "safety & boundaries", "task completion", "tool use"]
importance = ["critically_important", "important"]

[rubric.compiled_weight]
measure = "positive_weight_share"
measured_at_signoff = 0.0
absolute_weight_share = 0.5483
floor_applicability = "not_applicable"
floor_applicability_reason = "channel_relation is disjoint. The judged channel grades response content and run trajectory; the deterministic channel grades state change. A criterion about what a response asserted has no deterministic counterpart to compile into, so a share floor over this design measures the design rather than a defect. G-RUB-RESIDUE remains the live control and is not relaxed."

[verifier.robustness]
stability_trials = 2
flakiness_trials = 2

[leak_gate.carrier_exclusions]
"tests/validate.py" = "Deliberately staged into the image as /opt/harness/validate.py. instruction.md tells the agent to call it, so it is shared by design and its containment against the agent surface is 1.0 by construction rather than by leak."
"tests/test.sh" = "The verifier entrypoint. It is not copied into the image and the agent never sees it, but it also carries no answer content: it materialises a scorer and invokes pytest. Excluded because it is not answer-bearing, not because it is shared."
"tests/test_output.py" = "The graded oracle. Not staged into the image. It encodes which relations are graded rather than the answer to them, and the withheld reproducer it reads lives in tests/data/poc.bin, which IS in the private set."
"tests/judge.toml" = "The judged criteria. Criterion text describes what a correct answer must show, which is weaker than the answer; the answer itself lives in solution/truth.md, which IS in the private set."
"tests/rubrics.json" = "Not committed by this bundle. The auditor default set names it for bundles that use the plural filename."
"tests/test_weights.json" = "Test names and weights only, no answer content."
"solution/solve.sh" = "Publishes the two artifacts to /output and nothing else; it carries no answer content of its own."

[verifier.perturbations]
line_order = true
section_indentation = true
suite_name_prefixes = true
ordinal_suffixes = true
timestamps = true
interleaved_output = true

[environment.image]
built_platforms = ["linux/amd64", "linux/arm64"]
base_digest_amd64 = "sha256:47f14534bda344d9fe6ffd6effb95eefe579f4be0d508b7445cf77f61a0e5724"
base_digest_arm64 = "sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214"
built_platform = "linux/arm64"
built_from = "environment/Dockerfile at the pinned base digests"
built_at = "2026-10-17"

[upstream_provenance]
origin = "derived"
provenance_date = "2020-02-25"
source_kind = "public_repository"
license = "Apache-2.0"
modifications = [
    "Extracted an upstream source snapshot at the parent of the fix commit into environment/src.tgz.",
    "Removed the upstream git history so the staged source tree at /src/arrow carries no .git object database.",
    "Authored a task-specific harness driver, roundtrip behaviour probe, and judge, materialised into the image.",
    "Authored a verifier entrypoint at tests/test.sh and a 12-workload regression suite.",
    "Selected a withheld reproducer at tests/data/poc.bin and a second variant reproducer in tests/test_output.py, both distinct from the reference reproducer at solution/poc.bin.",
    "Authored the grading artifacts tests/test_output.py, tests/test_weights.json and tests/judge.toml.",
]

[upstream_provenance.source]
canonical_repo = "https://github.com/apache/arrow"
base_commit = "f3ac832e32a63480fb20dc607c31a7039d047d6b"
event_timestamp = "2020-02-25T15:41:35Z"
fixed_commit = "d2ab289294f5eaa175e6bc4ab5fb74b5ea013f6e"
