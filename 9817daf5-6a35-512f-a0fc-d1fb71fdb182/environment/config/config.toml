repo_to_patch = "arrow"
# The fuzz harnesses, named as they appear in the tree. Only paths that exist in
# this snapshot are listed: an entry matching nothing protects nothing.
#
# The build and regression scripts are deliberately absent from this list
# because they are absent from the tree -- they live under /opt/harness/scripts,
# so a diff of the repository cannot reach them. Their bytes are pinned by
# digest in the oracle instead, which detects an edit rather than declaring it
# out of bounds.
immutable_files = [
    "cpp/src/arrow/ipc/file_fuzz.cc",
    "cpp/src/arrow/ipc/stream_fuzz.cc",
    "cpp/src/parquet/arrow/fuzz.cc",
]
