aggregation = "weighted-sum"

[[criterion]]
id = "R1"
name = "numeric_decoder_general_grammar"
description = "The agent submits a patch whose HTTP URL policy check decodes a numeric host through one general parser of the one-to-four-part numeric address grammar instead of a list of fixed spellings."
type = "binary"
weight = 0.08823529411764706
[criterion.annotations]
mode = "judged"
type = "task completion"
evaluation_target = "state_change"
importance = "important"
source_weight = 3
total_positive_weight = 34.0
is_positive = true

