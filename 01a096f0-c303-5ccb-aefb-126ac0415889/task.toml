schema_version = "1.4"
reward_type = "bounded_continuous"
mode = "e2e"
artifacts = ["/output/poc.bin", "/output/fix.patch", "/logs/agent/trajectory.json"]
[task]
uuid_v5 = "01a096f0-c303-5ccb-aefb-126ac0415889"
authors = [{ name = "Krishna Kaushal", email = "krishna.kaushal@ethara.ai" }]
name = "ethara/01a096f0-c303-5ccb-aefb-126ac0415889"
description = "Diagnose and patch an SSRF vulnerability in a Go static site generator URL security policy [e2e]."
version = "1.0.0"
keywords = ["security", "e2e", "hugo", "go"]
[agent]
network_mode = "no-network"
timeout_sec = 5400
workspace = "/root/workspace"
user = "root"
[environment]
dockerfile = "environment/Dockerfile"
network_mode = "no-network"
build_timeout_sec = 7200.0
config = "environment/config/config.toml"
cpus = 2
memory_mb = 6144
storage_mb = 20480
gpus = 0
environment_mode = "separate"
[verifier]
# The deterministic pytest channel needs no network. The rubric judge does: the
# codex judge calls the host codex bridge, so the verifier runs under an allowlist
# limited to the bridge host. The agent and the environment stay offline.
network_mode = "allowlist"
allowed_hosts = ["172.17.0.1", "host.docker.internal"]
timeout_sec = 28200
entrypoint = "tests/test.sh"
reward_file = "/logs/verifier/reward.json"
environment_mode = "separate"
[verifier.env]
JUDGE_TRANSPORT = "${JUDGE_TRANSPORT:-codex}"
JUDGE_MODEL = "${JUDGE_MODEL:-openai/gpt-6.1-sol}"
CODEX_BRIDGE_URL = "${CODEX_BRIDGE_URL:-http://172.17.0.1:8788}"
KAKASHI_CODEX_BRIDGE_SECRET = "${KAKASHI_CODEX_BRIDGE_SECRET:-}"
LITELLM_LOCAL_MODEL_COST_MAP = "True"

[verifier.weights]
pytest = 0.5
rubric = 0.5
[verifier.robustness]
stability_trials = 2
flakiness_trials = 2
[rubric]
file = "tests/judge.toml"
judge_format = "harbor-reward-kit"
criteria_count = 18
positive_weight = 33
[metadata]
difficulty = "expert"
reward_keys = ["pytest", "rubric", "reward"]
reward_keys_note = "rubric is written only when the judge ran; otherwise reward.json carries pytest and reward, and reward = pytest."
judge = "openai/gpt-6.1-sol through the codex CLI 0.169.0"
judge_dependency = "The rubric half needs the codex bridge at CODEX_BRIDGE_URL (default http://172.17.0.1:8788) and its key in KAKASHI_CODEX_BRIDGE_SECRET. Without either, or without an agent trajectory, tests/test.sh records the rubric as UNSCORED in /logs/verifier/rubric_judge_failed.txt and reward = pytest. The judge runs as an unprivileged uid and sets only the rubric value; the pytest value is scored as root before it runs."
agent_network = "The agent container has no network. Claude Code is baked into the image, so the agent phase fetches no package; the harness admits only the model endpoint with harbor --allow-agent-host. Through a bridge, admit the bridge IP (172.17.0.1 for the host bridge on :8790). Directly, admit api.anthropic.com; the agent then needs DNS through Harbor's egress sidecar, which returned EAI_AGAIN on the EC2 host under Harbor 0.24 while the bridge IP worked."
agent_harness = "claude-code 2.1.326, baked at /usr/local/bin/claude and sha256-checked per architecture; run with --ak version=2.1.326 so Harbor uses it instead of installing one."
agent_model = "anthropic/claude-opus-4-8"
agent_run = "Through the host bridge: harbor run -p <task-dir> -a claude-code -m claude-opus-4-8 --ak version=2.1.326 --ak disable_web_search=true --ae ANTHROPIC_BASE_URL=http://172.17.0.1:8790 --ae ANTHROPIC_API_KEY=<bridge secret> --allow-agent-host 172.17.0.1. Pass the model without the anthropic/ prefix there: Harbor 0.24 forwards the prefix unchanged whenever ANTHROPIC_BASE_URL is set. Directly: -m anthropic/claude-opus-4-8 with CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY and --allow-agent-host api.anthropic.com."
difficulty_explanation = "Current grader (pytest P 37 from tests/test_weights.json; rubric P 33 over 18 criteria in tests/judge.toml, judged by openai/gpt-6.1-sol through the codex bridge; reward = 0.5 pytest + 0.5 rubric). Measured once on these grader bytes, with an earlier agent harness: claude-opus-4-8 pass@1 job 01a096f0-opus48-gpt61sol-20261119T063856Z (trial ZoVySXK) scored reward 0.4685 (pytest 0.2703 = 10 of 37, rubric 0.6667), below the 0.7 threshold. No claude-code / claude-opus-5-5 trajectory has been scored yet; pass@8 against the calibration models (Opus 5, GLM-5.3) is open."
mode = "e2e"
language = "go"
task_id = "01a096f0-c303-5ccb-aefb-126ac0415889"
category = "Code Security"
subcategory = "Vulnerability repair"
family = "real-source-reproducer"
kind = "repro-program"
tags = ["e2e", "hugo", "go"]
repo = "https://github.com/gohugoio/hugo"
platforms = ["linux/amd64", "linux/arm64"]
null_floor = 0.0
discrimination_weight = 0.5
[leak_gate]
private_carriers = ["solution/TRUTH.md", "solution/fix.patch", "solution/poc.bin", "solution/crash.log", "tests/data/poc.bin"]
agent_visible_roots = ["environment", "instruction.md"]
ngram_width = 8
normalization = "casefold; collapse all runs of non-alphanumeric to a single space; strip leading and trailing space"
containment_threshold = 0.30
[upstream_provenance]
origin = "derived"
advisory = "CVE-2026-58404, GHSA-pmrv-x7gp-2rjw"
contamination_note = "The main defect is CVE-2026-58404; its reference repair and the numeric held-out inputs follow upstream commit a00b5c72ac57afe26df6688ece3ca544a56df372, and the second-weakness (mixed-case scheme) inputs follow upstream commit 24d5e42ffa33eebdf906c495713f0d2bae30c0cb and advisory GHSA-pmrv-x7gp-2rjw (Apache-2.0); both are public and may predate the training cutoff of current models. The host-name resolution screen has no upstream counterpart."
provenance_date = "2026-10-27"
source_kind = "public_repository"
license = "Apache-2.0"
modifications = [
    "Extracted an upstream Hugo source snapshot into environment/src.tgz and pre-populated the Go module cache in the image for offline builds.",
    "Removed the upstream git history so the staged source tree at /src carries no .git object database.",
    "Authored a task-specific judge (tests/validate.py) that runs a submitted Go reproducer against a staged tree and reports a verdict.",
    "Authored a verifier entrypoint at tests/test.sh and the weighted oracle tests/test_output.py with tests/test_weights.json.",
    "Selected a withheld reproducer at tests/data/poc.bin and embedded variant, resolved-host and preservation programs in tests/test_output.py, all distinct from the reference reproducer at solution/poc.bin.",
    "Authored the judged rubric tests/judge.toml.",
    "The graded repair design deliberately exceeds the upstream fix. Upstream closed the numeric-encoding bypass in gohugoio/hugo commit a00b5c72ac57afe26df6688ece3ca544a56df372 with a canonical dotted-decimal re-check alone, and closed the mixed-case scheme bypass in commit 24d5e42ffa33eebdf906c495713f0d2bae30c0cb with a case-insensitive deny rule plus public-address classification of an already-resolved address at dial time; neither upstream commit adds host-name resolution to the policy check, and no such mechanism exists in config/security/securityConfig.go at any point in that project's history. This task additionally requires a resolution-time screen for the default policy, graded by test_patched_resolved_host_poc_neutralized and test_patched_internal_name_classes_neutralized (10 of 37 positive points) and by rubric rows R5 through R9 (15 of 33, about 45 percent of the positive rubric weight). A repair faithful only to the two upstream commits therefore does not reach the full reward.",
]
[upstream_provenance.source]
canonical_repo = "https://github.com/gohugoio/hugo"
base_commit = "cf9c8f93ca2a2838ce378f9e36d052ac2f79e229"
event_timestamp = "2026-10-27T00:00:00Z"
fixed_commit = "a00b5c72ac57afe26df6688ece3ca544a56df372"
secondary_fixed_commit = "24d5e42ffa33eebdf906c495713f0d2bae30c0cb"
